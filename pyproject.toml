[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-appointment-scheduler"
version = "0.1.0"
description = "Production-grade Strands appointment scheduling agent: real CMS provider search, FastAPI scheduling service, MCP tools, session + three-layer memory, PHI-by-reference, deterministic form filling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "strands-agents>=1.0",
    "litellm>=1.0",
    "mcp>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "libsql>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
appointment-scheduler-demo = "agent_appointment_scheduler.demo:main"
appointment-scheduler-server = "agent_appointment_scheduler.api:main"
appointment-scheduler-eval = "agent_appointment_scheduler.eval:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_appointment_scheduler = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
